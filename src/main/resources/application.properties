spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:councildb;DB_CLOSE_DELAY=-1
#spring.datasource.url=jdbc:h2:file:./data/councildb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: Specify JavaFX version if needed by any utility or specific configuration
# (Though typically managed by POM for dependencies)
